rules:
  - id: yaml-excessive-capture
    metadata:
      issue: https://github.com/returntocorp/lens/issues/5698
    pattern: |
      $X:
        foo: true
    fix: "y: false"
    message: >
      If lens is not smart enough, it will match beyond the specified pattern
      and capture all text until `z`. So the fix will result in `y: falsez: "z"`
    languages:
      - yaml
    severity: ERROR
