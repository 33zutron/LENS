rules:
  - id: taint-rust-returns
    message: Lens found a match
    languages:
      - rust
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              fn $FUNC(...) -> $RET {
                ...
              }
          - pattern: |
              source
    pattern-sinks:
      - patterns:
          - pattern: |
              return ...
