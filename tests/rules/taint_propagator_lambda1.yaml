rules:
- id: test
  mode: taint
  pattern-sources:
    - pattern: tainted
  pattern-propagators:
    - pattern: |
        test_iterator($X, lambda $Y: ...)
      from: $X
      to: $Y
  pattern-sinks:
    - pattern: sink(...)
  message: Lens found a match
  languages:
    - python
  severity: WARNING
