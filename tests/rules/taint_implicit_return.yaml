rules:
  - id: taint-implicit-return
    message: Lens found a match
    languages:
      - rust
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              fn $F(..., $S : String, ...) -> String {
                ...
              }
          - pattern: $S
    pattern-sinks:
      - pattern: |
          fn $F(...) -> String{
              ...
          }
