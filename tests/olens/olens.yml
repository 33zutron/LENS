# tests for olens to run on Lens codebase.
# usage: ./_build/default/src/olens/main/Main.exe --config tests/olens/olens.yml --quiet --json cli/ src/
rules:
- id: py1
  pattern: |
    def __str__($ARG):
      return self.$X
  message: $X matched
  languages: [python]
  severity: WARNING
- id: ocaml1
  pattern: |
    extracted_targets_of_config $ARG1 $ARG2 $ARG3
  message: $ARG1 matched
  languages: [ocaml]
  severity: WARNING
