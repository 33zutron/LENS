# AUTOGENERATED FROM build-test-osx-arm64.jsonnet DO NOT MODIFY
jobs:
  build-core:
    runs-on: macos-15-xlarge
    steps:
      - name: Configure git safedir properly
        run: git config --global --add safe.directory $(pwd)
      - name: Make checkout speedy
        run: git config --global fetch.parallel 50
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: true
      - name: Unlink openssl@3 (brew lock workaround)
        run: brew unlink openssl@3 || true
      - env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        uses: lens/setup-ocaml@a739c5405d73c42ef15a9dc995efc0f87396cc36
        with:
          cache-prefix: v8-lens-${{ hashFiles('opam-lockfiles/*.locked', '*.opam', 'dev/required.opam', 'libs/ocaml-tree-sitter-lens/core/tree-sitter.opam', 'cli/src/lens/lens_interfaces/lens-interfaces.opam', 'OSS/opam-lockfiles/*.locked', 'OSS/*.opam', 'OSS/dev/required.opam', 'OSS/libs/ocaml-tree-sitter-lens/core/tree-sitter.opam', 'OSS/cli/src/lens/lens_interfaces/lens-interfaces.opam') }}
          ocaml-compiler: ocaml-variants.5.4.0+options,ocaml-option-flambda
          opam-pin: false
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git#922f67e068446a8d8e809a40251a259bd0549552
          save-opam-post-run: true
      - name: Install dependencies
        run: opam exec -- make install-deps
      - name: Build lens-core
        run: opam exec -- make
      - name: Test lens-core
        run: opam exec -- make test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lens-osx-arm64-${{ github.sha }}
          path: ./bin/lens-core
name: build-test-osx-arm64
on:
  workflow_call: null
  workflow_dispatch: null
