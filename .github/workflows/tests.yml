# AUTOGENERATED FROM tests.jsonnet DO NOT MODIFY
jobs:
  benchmarks-lite:
    needs:
      - build-test-core-x86
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Fetch lens-cli submodules
        run: git submodule update --init --recursive --recommend-shallow cli/src/lens/lens_interfaces
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: auto
          python-version: "3.10"
          version: 0.13.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lens-core-x86-artifact
          path: artifacts
      - name: Install artifacts
        run: |
          # upload-artifact does not preserve the executable bit
          # (https://github.com/actions/upload-artifact#permission-loss),
          # so restore it before installing lens-core.
          chmod +x artifacts/*
          #alt: put it in cli/src/lens/bin/, like make copy-core-for-cli
          sudo cp artifacts/* /usr/bin
      - name: Install Python dependencies
        run: uv sync --locked
        working-directory: cli
      - name: Test dummy benchmarks on latest
        run: |
          uv run lens --version
          uv run lens-core -version
          uv run python3 ../perf/run-benchmarks --dummy
        working-directory: cli
  build-test-core-x86:
    uses: ./.github/workflows/build-test-core-x86.yml
  build-test-docker:
    uses: ./.github/workflows/build-test-docker.yml
  build-test-osx-arm64:
    uses: ./.github/workflows/build-test-osx-arm64.yml
  test-cli:
    name: test lens-cli
    needs:
      - build-test-core-x86
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Fetch lens-cli submodules
        run: git submodule update --init --recursive --recommend-shallow cli/src/lens/lens_interfaces
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: auto
          python-version: ${{ matrix.python }}
          version: 0.13.4
      - name: Install Python dependencies
        run: uv sync --locked
        working-directory: cli
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lens-core-x86-artifact
          path: artifacts
      - name: Install artifacts
        run: |
          # upload-artifact does not preserve the executable bit
          # (https://github.com/actions/upload-artifact#permission-loss),
          # so restore it before installing lens-core.
          chmod +x artifacts/*
          #alt: put it in cli/src/lens/bin/, like make copy-core-for-cli
          sudo cp artifacts/* /usr/bin
      - name: Run pytest
        run: |
          # tests should simulate CI environment iff they need one
          unset CI
          unset "${!GITHUB_@}"
          # TODO(jmgrosen): this is a temporary hack to fix snapshot output
          # formatting in OSS tests. See #5493.
          export COLUMNS=80

          PYTEST_EXTRA_ARGS="--snapshot-update --allow-snapshot-deletion" make ci-test
        working-directory: cli
      - if: failure()
        name: Prepare repo for snapshot commit
        run: |
          # the commit step that follows will fail to fetch the pfff submodule
          # (perhaps because of the github token's permissions)
          # so we disable recursive fetching
          git config fetch.recurseSubmodules false
      - id: configure-creds
        if: failure() && github.event_name == 'pull_request' && (github.actor != 'dependabot[bot]' && !(github.event.pull_request.head.repo.full_name != github.repository))
        name: Configure git creds for push
        run: |
          echo "machine github.com" >> ~/.netrc
          echo "login ${{ github.repository }}" >> ~/.netrc
          echo "password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
      - id: snapshot-commit
        if: failure() && github.event_name == 'pull_request' && (github.actor != 'dependabot[bot]' && !(github.event.pull_request.head.repo.full_name != github.repository))
        name: Commit snapshot updates
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8
        with:
          add: cli/tests/default/e2e/snapshots
          default_author: github_actions
          message: Update pytest snapshots
          new_branch: snapshot-updates-${{ github.run_id }}-${{ github.run_attempt }}
      - id: remove-creds
        if: failure() && github.event_name == 'pull_request' && (github.actor != 'dependabot[bot]' && !(github.event.pull_request.head.repo.full_name != github.repository))
        name: Remove Credentials
        run: rm ~/.netrc
      - env:
          COMMIT_LONG_SHA: ${{ steps.snapshot-commit.outputs.commit_long_sha }}
          COMMIT_SHA: ${{ steps.snapshot-commit.outputs.commit_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        if: failure() && steps.snapshot-commit.outputs.pushed == 'true'
        name: Comment about any snapshot updates
        run: |
          echo ":camera_flash: The pytest shapshots changed in your PR." >> /tmp/message.txt
          echo "Please carefully review these changes and make sure they are intended:" >> /tmp/message.txt
          echo >> /tmp/message.txt
          echo "1. Review the changes at https://github.com/lens/lens/commit/$COMMIT_LONG_SHA" >> /tmp/message.txt
          echo "2. Accept the new snapshots with" >> /tmp/message.txt
          echo >> /tmp/message.txt
          echo "       git fetch origin && git cherry-pick \"$COMMIT_SHA\" && git push" >> /tmp/message.txt

          gh pr comment "$PULL_REQUEST_NUMBER" --body-file /tmp/message.txt
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
  test-olens:
    container: alpine:3.23
    env:
      HOME: /root
    runs-on: ubuntu-latest
    steps:
      - name: setup alpine
        run: apk add --no-cache git git-lfs bash curl build-base make bubblewrap rsync
      - name: Configure git safedir properly
        run: git config --global --add safe.directory $(pwd)
      - name: Make checkout speedy
        run: git config --global fetch.parallel 50
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: true
      - env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        uses: lens/setup-ocaml@a739c5405d73c42ef15a9dc995efc0f87396cc36
        with:
          cache-prefix: v8-lens-${{ hashFiles('opam-lockfiles/*.locked', '*.opam', 'dev/required.opam', 'libs/ocaml-tree-sitter-lens/core/tree-sitter.opam', 'cli/src/lens/lens_interfaces/lens-interfaces.opam', 'OSS/opam-lockfiles/*.locked', 'OSS/*.opam', 'OSS/dev/required.opam', 'OSS/libs/ocaml-tree-sitter-lens/core/tree-sitter.opam', 'OSS/cli/src/lens/lens_interfaces/lens-interfaces.opam') }}
          ocaml-compiler: ocaml-variants.5.4.0+options,ocaml-option-flambda
          opam-pin: false
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git#922f67e068446a8d8e809a40251a259bd0549552
          save-opam-post-run: true
      - name: Build lens-core
        run: |
          eval $(opam env)
          make install-deps
          make core
      - name: Install olens
        run: |
          eval $(opam env)
          make copy-core-for-cli
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: auto
          python-version: "3.11"
          version: 0.13.4
      - name: Run pytest for olens known passing tests
        run: |
          git config --global --add safe.directory "$(pwd)"
          make osempass
        working-directory: cli
  test-qa:
    name: quality assurance on lens
    needs:
      - build-test-core-x86
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Fetch lens-cli submodules
        run: git submodule update --init --recursive --recommend-shallow cli/src/lens/lens_interfaces tests/lens-rules
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: auto
          python-version: "3.12"
          version: 0.13.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lens-core-x86-artifact
          path: artifacts
      - name: Install artifacts
        run: |
          # upload-artifact does not preserve the executable bit
          # (https://github.com/actions/upload-artifact#permission-loss),
          # so restore it before installing lens-core.
          chmod +x artifacts/*
          #alt: put it in cli/src/lens/bin/, like make copy-core-for-cli
          sudo cp artifacts/* /usr/bin
      - name: Install lens
        run: |
          export PATH=/github/home/.local/bin:$PATH
          uv sync --locked
        working-directory: cli
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: qa-public-repos-${{ hashFiles('lens/tests/qa/*public_repos*') }}-${{ matrix.split }}
          path: ~/.cache/qa-public-repos
      - run: |
          mkdir -p ~/.cache/qa-public-repos
          touch ~/.cache/qa-public-repos/ok
      - env:
          QA_TESTS_CACHE_PATH: ~/.cache/qa-public-repos
        name: Test lens
        run: |
          export PATH=/github/home/.local/bin:$PATH
          uv run pytest -n auto -vv --tb=short --splits 4 --group ${{ matrix.split }} tests/qa
        working-directory: cli
    strategy:
      fail-fast: false
      matrix:
        split:
          - 1
          - 2
          - 3
          - 4
  test-lens-core:
    container: alpine:3.23
    env:
      HOME: /root
    runs-on: ubuntu-latest
    steps:
      - name: setup alpine
        run: apk add --no-cache git git-lfs bash curl build-base make bubblewrap rsync
      - name: Configure git safedir properly
        run: git config --global --add safe.directory $(pwd)
      - name: Make checkout speedy
        run: git config --global fetch.parallel 50
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: true
      - env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        uses: lens/setup-ocaml@a739c5405d73c42ef15a9dc995efc0f87396cc36
        with:
          cache-prefix: v8-lens-${{ hashFiles('opam-lockfiles/*.locked', '*.opam', 'dev/required.opam', 'libs/ocaml-tree-sitter-lens/core/tree-sitter.opam', 'cli/src/lens/lens_interfaces/lens-interfaces.opam', 'OSS/opam-lockfiles/*.locked', 'OSS/*.opam', 'OSS/dev/required.opam', 'OSS/libs/ocaml-tree-sitter-lens/core/tree-sitter.opam', 'OSS/cli/src/lens/lens_interfaces/lens-interfaces.opam') }}
          ocaml-compiler: ocaml-variants.5.4.0+options,ocaml-option-flambda
          opam-pin: false
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git#922f67e068446a8d8e809a40251a259bd0549552
          save-opam-post-run: true
      - name: Install dependencies
        run: opam exec -- make install-deps
      - name: Build lens-core
        run: opam exec -- make
      - name: Test lens-core
        run: opam exec -- make test
